# The web tier of the Compose stack: serves the built app and proxies /api to
# the backend. This is the only published port; the API itself is reachable
# from nothing but this proxy (and whatever authenticating proxy sits in front).
server {
    # nginx-unprivileged runs as a normal user, which cannot bind port 80.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
               image/svg+xml;
    gzip_min_length 1024;

    # Proxy API calls to the backend service
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The Excel import uploads the whole purchasing workbook; nginx's 1 MB
        # default refused it before the API saw it. Keep in step with the
        # backend's MAX_UPLOAD_BYTES.
        client_max_body_size 25m;
        # Workbook exports are built in memory and can take a moment.
        proxy_read_timeout 120s;
        # Never give a stale JSON answer from a browser cache.
        add_header Cache-Control "no-store" always;
    }

    # Vite names built assets by content hash, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback: index.html must be revalidated so a new deploy is picked up.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
