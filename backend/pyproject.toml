[project]
name = "rfq-planner-backend"
version = "1.0.0"
description = "RFQ Planner API"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]
extend-exclude = ["alembic/versions/__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "SIM"]
ignore = [
    # FastAPI's `Depends()` in a parameter default is the framework's idiom.
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# The migrations directory is also called `alembic`; the import is the library.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
