name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rfq_test
          POSTGRES_PASSWORD: rfq_test
          POSTGRES_DB: rfq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rfq_test -d rfq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://rfq_test:rfq_test@localhost:5432/rfq_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Run backend tests on SQLite
        run: python -m pytest tests -q
      - name: Create a database for the PostgreSQL run
        run: psql "$TEST_POSTGRES_URL" -c 'CREATE DATABASE rfq_suite'
      - name: Run backend tests on PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://rfq_test:rfq_test@localhost:5432/rfq_suite
        run: python -m pytest tests -q

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Run frontend tests
        run: npm test
      - name: Type-check
        run: npm run typecheck
      - name: Build production bundle
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --tag rfq-backend:ci ./backend
      - name: Build frontend image
        run: docker build --tag rfq-frontend:ci ./frontend
      - name: Validate the Compose file
        run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-only
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 180
        env:
          POSTGRES_PASSWORD: ci-only
      - name: Smoke-test the deployment contract
        env:
          POSTGRES_PASSWORD: ci-only
        run: |
          set -eux
          curl -fsS http://localhost:8080/api/health
          # The API is reachable only through the web tier
          if curl -s --max-time 5 http://localhost:8000/api/health; then
            echo "the backend port is published on the host" >&2
            exit 1
          fi
          # A 2 MB upload passes nginx (whose default cap was 1 MB) and reaches
          # the API, which answers for the missing project rather than with 413
          head -c 2097152 /dev/urandom > big.bin
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -F "file=@big.bin;filename=big.xlsx" \
            "http://localhost:8080/api/hw/projects/1/import?dry_run=true")
          test "$code" = "404"
          # A 30 MB upload is refused at the edge
          head -c 31457280 /dev/urandom > huge.bin
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -F "file=@huge.bin;filename=huge.xlsx" \
            "http://localhost:8080/api/hw/projects/1/import?dry_run=true")
          test "$code" = "413"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the browser smoke-test runner
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the browser smoke test against the stack
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npm run e2e
      - name: Keep the smoke-test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Show stack logs
        if: failure()
        run: docker compose logs
        env:
          POSTGRES_PASSWORD: ci-only
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
        env:
          POSTGRES_PASSWORD: ci-only
